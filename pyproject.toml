[project]
name = "ocs-llm-answerer"
version = "0.1.0"
description = "OCS-compatible question answering backend powered by configurable LLM providers."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "mochenya", email = "74086519+mochenya@users.noreply.github.com" },
]
keywords = ["fastapi", "llm", "ocs", "openai", "question-answering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.1",
    "openai>=2.35.1",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=0.21.0",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
ocs-llm-answerer = "ocs_llm_answerer.cli:main"

[project.urls]
Repository = "https://github.com/mochenya/ocs-llm-answerer.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.hatch.build.targets.wheel]
packages = ["src/ocs_llm_answerer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
